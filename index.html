:root {
  --font-display: Georgia, "Iowan Old Style", "Palatino Linotype", "Book Antiqua", serif;
  --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
  --bg: #F5F3E9;
  --bg-card: #FFFDF8;
  --sage: #3F4F3A;
  --sage-deep: #2C3928;
  --leaf: #7C9473;
  --tilleul: #E1E7D6;
  --honey: #C8862E;
  --honey-deep: #9C671F;
  --ink: #34402F;
  --muted: #8C8870;
  --border: #E1DCC7;
  --shadow-sm: 0 1px 3px rgba(63,79,58,0.10);
  --shadow-md: 0 6px 18px rgba(63,79,58,0.14);
  --shadow-lg: 0 14px 36px rgba(44,57,40,0.20);
}

* { box-sizing: border-box; }

.app-root {
  font-family: var(--font-body); color: var(--ink); min-height: 100vh; padding: 18px 16px 48px; max-width: 640px; margin: 0 auto;
  background-color: var(--bg);
  background-image:
    radial-gradient(ellipse 120% 80% at 15% -10%, rgba(124,148,115,0.13), transparent 55%),
    radial-gradient(ellipse 90% 60% at 100% 0%, rgba(200,134,46,0.09), transparent 50%);
  background-attachment: fixed;
}
/* Sur \xE9cran large (tablette pos\xE9e en cuisine, ordinateur), l'appli utilise toute la largeur disponible */
h1, h2, h3 { font-family: var(--font-display); color: var(--sage); margin: 0; }

.app-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; padding: 6px 2px 16px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 9px; }
.brand h1 { font-size: 1.62rem; font-weight: 600; letter-spacing: -0.01em; line-height: 1.1; }
.brand-block { display: flex; flex-direction: column; gap: 3px; }
.brand-tagline { font-family: var(--font-display); font-style: italic; font-size: 0.78rem; color: var(--honey-deep); letter-spacing: 0.01em; }
.version-pill { font-family: var(--font-mono); font-size: 0.66rem; color: var(--muted); background: var(--tilleul); padding: 2px 7px; border-radius: 999px; align-self: flex-start; }
.header-actions { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }

.icon-btn { background: transparent; border: none; cursor: pointer; color: var(--sage); padding: 8px; min-width: 38px; min-height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center; transition: background 0.15s ease, transform 0.1s ease; }
.header-actions .icon-btn, .form-header .icon-btn, .detail-actions .icon-btn { min-width: 44px; min-height: 44px; }
.fab-add {
  position: fixed; right: 18px; bottom: calc(18px + env(safe-area-inset-bottom));
  width: 56px; height: 56px; border-radius: 50%; border: none; cursor: pointer;
  background: linear-gradient(180deg, #86A17B, var(--leaf)); color: #FBFAF4;
  display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow-lg); z-index: 60;
}
.fab-add:active { transform: scale(0.94); }
@media (min-width: 760px) { .fab-add { display: none; } }
@media (max-width: 759px) { .add-recipe-btn { display: none; } }
.icon-btn:hover { background: var(--tilleul); }
.icon-btn:active { transform: scale(0.94); }
.icon-btn--active { background: #FBF0DC; }
.icon-btn--danger { color: #A8512F; }
.icon-btn--danger:hover { background: #F3DED4; }
.icon-btn--locked { opacity: 0.55; }

.btn { border: none; border-radius: 999px; cursor: pointer; font-family: var(--font-body); font-weight: 500; padding: 10px 16px; display: inline-flex; align-items: center; gap: 6px; font-size: 0.92rem; transition: transform 0.12s ease, box-shadow 0.12s ease; }
.btn-primary { background: linear-gradient(180deg, #86A17B, var(--leaf)); color: #FBFAF4; box-shadow: var(--shadow-sm); }
.btn-primary:hover:not(:disabled) { transform: translateY(-1px); box-shadow: var(--shadow-md); }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-ghost { background: var(--bg-card); color: var(--sage); border: 1px solid var(--border); }
.btn-ghost:hover { border-color: var(--leaf); }
.btn-sm { padding: 8px 13px; font-size: 0.85rem; }

.demo-banner { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: #FBF0DC; border: 1px solid #E8CB93; color: #7A5A22; border-radius: 12px; padding: 9px 12px; font-size: 0.82rem; margin-bottom: 10px; flex-wrap: wrap; }
.demo-banner .btn-ghost { border-color: #E8CB93; color: #7A5A22; white-space: nowrap; }

.search-bar { display: flex; align-items: center; gap: 8px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; padding: 9px 12px; color: var(--muted); margin-bottom: 10px; box-shadow: var(--shadow-sm); }
.search-bar input { border: none; outline: none; background: transparent; flex: 1; font-size: 0.95rem; color: var(--ink); font-family: var(--font-body); }
.search-scope-btn { border: 1px solid var(--border); background: transparent; color: var(--muted); border-radius: 999px; padding: 4px 10px; font-size: 0.7rem; cursor: pointer; white-space: nowrap; font-family: var(--font-body); }
.search-scope-btn--on { background: var(--leaf); color: #FBFAF4; border-color: var(--leaf); }

.filter-panel { background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; padding: 12px; margin-bottom: 14px; display: flex; flex-direction: column; gap: 8px; box-shadow: var(--shadow-sm); }
.filter-group-label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); margin-top: 4px; }
.filter-hint { text-transform: none; letter-spacing: normal; font-size: 0.7rem; opacity: 0.85; }
.chip-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip { border: 1px solid; border-radius: 999px; padding: 7px 13px; min-height: 34px; font-size: 0.8rem; cursor: pointer; font-family: var(--font-body); background: transparent; transition: transform 0.1s ease; }
.chip:active { transform: scale(0.96); }
.sort-row { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: var(--muted); margin-top: 4px; }
.sort-row select { border: 1px solid var(--border); border-radius: 8px; padding: 4px 8px; font-family: var(--font-body); }

.strategy-picker { display: flex; gap: 4px; background: var(--tilleul); border-radius: 999px; padding: 3px; width: fit-content; }
.strategy-picker--compact { transform: scale(0.9); transform-origin: left; }
.strategy-btn { border: none; background: transparent; padding: 6px 12px; border-radius: 999px; font-size: 0.78rem; cursor: pointer; color: var(--sage); font-family: var(--font-body); }
.strategy-btn--active { background: var(--leaf); color: #FBFAF4; }

.recipe-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 420px) { .recipe-grid { grid-template-columns: 1fr; } }

.empty-state { grid-column: 1 / -1; text-align: center; padding: 40px 10px; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 10px; }
.empty-hint { color: var(--muted); font-size: 0.85rem; }

.card {
  position: relative; background: var(--bg-card); border: 1px solid var(--border); border-radius: 4px 14px 14px 14px;
  padding: 13px 13px 12px; cursor: pointer; display: flex; flex-direction: column; gap: 8px;
  box-shadow: var(--shadow-sm); transition: transform 0.14s ease, box-shadow 0.14s ease;
}
.card::after {
  content: ""; position: absolute; top: 0; right: 0; width: 0; height: 0;
  border-style: solid; border-width: 0 15px 15px 0; border-color: transparent var(--bg) transparent transparent;
  filter: drop-shadow(-1.5px 1.5px 1.5px rgba(44,57,40,0.14)); border-radius: 0 4px 0 0;
}
.card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
.card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 6px; padding-right: 10px; }
.cat-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 0.72rem; padding: 3px 8px; border-radius: 999px; font-weight: 500; }
.card-title { font-size: 1.08rem; line-height: 1.25; }
.card-meta { display: flex; flex-wrap: wrap; gap: 8px; font-size: 0.76rem; color: var(--muted); font-family: var(--font-mono); }
.meta-item { display: flex; align-items: center; gap: 3px; }
.meta-price { color: var(--honey-deep); font-weight: 600; }
.meta-hint { color: var(--muted); font-weight: 400; }
.field-hint { font-size: 0.76rem; color: var(--muted); font-weight: 400; font-family: var(--font-mono); }
.field-hint--block { display: block; margin-top: 3px; }
.duration-inputs { display: flex; align-items: center; gap: 5px; }
.duration-inputs input { min-width: 0; }
.duration-sep { font-size: 0.76rem; color: var(--muted); white-space: nowrap; }
.reorder-cell { display: flex; flex-direction: column; gap: 1px; }
.reorder-cell .icon-btn { padding: 2px; }
.reorder-cell .icon-btn:disabled { opacity: 0.25; cursor: default; }
.ing-combobox { position: relative; }
.ing-combobox-list {
  position: absolute; z-index: 30; top: calc(100% + 2px); left: 0; right: 0;
  background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px;
  box-shadow: var(--shadow-md); max-height: 220px; overflow-y: auto; padding: 4px;
}
.ing-combobox-item {
  display: block; width: 100%; text-align: left; background: none; border: none; cursor: pointer;
  padding: 7px 9px; border-radius: 6px; font-size: 0.85rem; font-family: var(--font-body); color: var(--ink);
}
.ing-combobox-item:hover { background: var(--tilleul); }
.ing-combobox-footer { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-top: 4px; }
.ing-combobox-item--create { color: var(--leaf); font-weight: 500; border-top: 1px solid var(--border); display: flex; align-items: center; gap: 4px; }
.fourn-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; }
.fourn-card-head { display: flex; align-items: center; justify-content: space-between; cursor: pointer; gap: 8px; }
.fourn-card-actions { display: flex; align-items: center; gap: 2px; }
.fourn-toolbar { display: flex; gap: 8px; flex-wrap: wrap; }
.fourn-card-body { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
.card-bottom { display: flex; align-items: center; justify-content: space-between; margin-top: 2px; }

.tested-pill { border: 1px solid var(--border); background: transparent; color: var(--muted); border-radius: 999px; padding: 6px 11px; min-height: 32px; font-size: 0.74rem; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; font-family: var(--font-body); transition: background 0.12s ease; }
.tested-pill--on { background: var(--tilleul); color: var(--sage); border-color: var(--leaf); }

.form-view, .detail-view { display: flex; flex-direction: column; gap: 14px; padding-top: 6px; }
.form-header { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.form-header-actions { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.unsaved-pill { font-size: 0.68rem; color: var(--honey-deep); background: #FBF0DC; border: 1px solid #E8CB93; border-radius: 999px; padding: 2px 8px; white-space: nowrap; }
.form-header h2 { font-size: 1.15rem; }
.detail-actions { margin-left: auto; display: flex; gap: 4px; }

.field { display: flex; flex-direction: column; gap: 5px; font-size: 0.82rem; color: var(--muted); flex: 1; }
.field input, .field select, .field textarea { font-family: var(--font-body); font-size: 0.95rem; color: var(--ink); border: 1px solid var(--border); border-radius: 10px; padding: 9px 10px; background: var(--bg-card); outline: none; }
.field textarea { resize: vertical; font-family: var(--font-mono); font-size: 0.86rem; }
.field-row { display: flex; gap: 10px; }
.field-row--3 > .field { flex: 1; }
.select-with-add { display: flex; gap: 6px; align-items: center; }
.select-with-add select, .select-with-add input { flex: 1; }
.link-btn { background: none; border: none; color: var(--leaf); font-size: 0.78rem; cursor: pointer; white-space: nowrap; text-decoration: underline; display: inline-flex; align-items: center; gap: 4px; }

.toggles { align-items: center; flex-wrap: wrap; gap: 14px 18px; }
.switch-row { display: flex; align-items: center; gap: 6px; font-size: 0.88rem; color: var(--ink); }

.form-actions { display: flex; justify-content: flex-end; gap: 10px; padding-top: 6px; }

.detail-hero { display: flex; flex-direction: column; gap: 8px; }
.detail-hero h1 { font-size: 1.85rem; line-height: 1.15; letter-spacing: -0.01em; margin-top: 2px; }
.detail-toggles { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 2px; }
.detail-section { border-top: 1px solid var(--border); padding-top: 12px; }
.detail-section h3 { font-size: 0.95rem; margin-bottom: 8px; }
.ingredient-list { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 7px; font-size: 1rem; }
.steps-text { white-space: pre-wrap; line-height: 1.7; font-size: 1.02rem; }
.steps-checklist { display: flex; flex-direction: column; gap: 4px; }
.step-item { display: flex; align-items: flex-start; gap: 10px; padding: 9px 10px; border-radius: 10px; cursor: pointer; line-height: 1.65; font-size: 1.02rem; transition: background 0.12s ease; }
.step-item:hover { background: var(--tilleul); }
.step-item--done { color: var(--muted); text-decoration: line-through; }
.step-check { flex-shrink: 0; width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid var(--border); display: flex; align-items: center; justify-content: center; margin-top: 2px; color: #FBFAF4; }
.step-item--done .step-check { background: var(--leaf); border-color: var(--leaf); }
.ing-row-tap { cursor: pointer; }
.ing-row-tap:active td { background: var(--tilleul); }
.ing-row-tap--done td { color: var(--muted); text-decoration: line-through; }
.notes-text { white-space: pre-wrap; font-size: 0.88rem; color: var(--muted); }
.tag-row { display: flex; flex-wrap: wrap; gap: 6px; }
.tag-row--sm { margin-top: -2px; }
.tag { background: var(--tilleul); color: var(--sage); border-radius: 999px; padding: 4px 10px; font-size: 0.76rem; }
.tag--carte { background: #FBF0DC; color: #8A6420; display: inline-flex; align-items: center; gap: 3px; }
.tag--sm { padding: 2px 8px; font-size: 0.68rem; }
.detail-footer { color: var(--muted); font-size: 0.88rem; }

.ing-table-wrap { display: flex; flex-direction: column; gap: 8px; }
.ing-table-header-row { display: flex; align-items: center; justify-content: space-between; font-size: 0.82rem; color: var(--muted); flex-wrap: wrap; gap: 6px; }
.ing-table-header-links { display: flex; align-items: center; gap: 10px; }
.ing-alt-header { color: var(--honey-deep); font-size: 0.68rem; text-align: center; }
.ing-alt-qty { width: 100%; }
.altm-new { flex-wrap: wrap; align-items: center; }
.altm-row { display: flex; align-items: center; gap: 6px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; flex-wrap: wrap; }
.altm-label { flex: 1.2; min-width: 100px; border: 1px solid var(--border); border-radius: 8px; padding: 6px 8px; font-family: var(--font-body); font-size: 0.85rem; }
.altm-food { flex: 1.3; min-width: 110px; border: 1px solid var(--border); border-radius: 8px; padding: 6px 8px; font-family: var(--font-body); font-size: 0.85rem; color: var(--muted); }
.altm-num { width: 60px; border: 1px solid var(--border); border-radius: 8px; padding: 6px 6px; font-family: var(--font-body); font-size: 0.85rem; text-align: center; }
.altm-eq { color: var(--muted); font-size: 0.8rem; }
.storage-panel { max-width: 460px; }
.storage-bar-wrap { display: flex; flex-direction: column; gap: 6px; }
.storage-bar { width: 100%; height: 10px; border-radius: 999px; background: var(--tilleul); overflow: hidden; }
.storage-bar-fill { height: 100%; border-radius: 999px; transition: width 0.3s ease; }
.storage-bar-label { font-size: 0.78rem; color: var(--muted); }
