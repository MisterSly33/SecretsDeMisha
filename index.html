:root {
  --font-display: Georgia, "Iowan Old Style", "Palatino Linotype", "Book Antiqua", serif;
  --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
  --bg: #F5F3E9;
  --bg-card: #FFFDF8;
  --sage: #3F4F3A;
  --sage-deep: #2C3928;
  --leaf: #7C9473;
  --tilleul: #E1E7D6;
  --honey: #C8862E;
  --honey-deep: #9C671F;
  --ink: #34402F;
  --muted: #8C8870;
  --border: #E1DCC7;
  --shadow-sm: 0 1px 3px rgba(63,79,58,0.10);
  --shadow-md: 0 6px 18px rgba(63,79,58,0.14);
  --shadow-lg: 0 14px 36px rgba(44,57,40,0.20);
}

* { box-sizing: border-box; }

.app-root {
  font-family: var(--font-body); color: var(--ink); min-height: 100vh; padding: 18px 16px 48px; max-width: 640px; margin: 0 auto;
  background-color: var(--bg);
  background-image:
    radial-gradient(ellipse 120% 80% at 15% -10%, rgba(124,148,115,0.13), transparent 55%),
    radial-gradient(ellipse 90% 60% at 100% 0%, rgba(200,134,46,0.09), transparent 50%);
  background-attachment: fixed;
}
/* Sur \xE9cran large (tablette pos\xE9e en cuisine, ordinateur), l'appli utilise toute la largeur disponible */
h1, h2, h3 { font-family: var(--font-display); color: var(--sage); margin: 0; }

.app-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; padding: 6px 2px 16px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 9px; }
.brand h1 { font-size: 1.62rem; font-weight: 600; letter-spacing: -0.01em; line-height: 1.1; }
.brand-block { display: flex; flex-direction: column; gap: 3px; }
.brand-tagline { font-family: var(--font-display); font-style: italic; font-size: 0.78rem; color: var(--honey-deep); letter-spacing: 0.01em; }

.merge-option-name { flex: 1; font-weight: 500; }
.merge-option-meta { font-size: 0.76rem; color: var(--muted); font-family: var(--font-mono); }
.merge-summary { font-size: 0.86rem; color: var(--sage); background: var(--tilleul); border-radius: 10px; padding: 9px 12px; margin: 0; }
.cat-manage-row { display: flex; align-items: center; gap: 8px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 6px 8px; }
.cat-manage-row input { flex: 1; border: none; background: transparent; font-family: var(--font-body); font-size: 0.92rem; padding: 4px 6px; outline: none; }
.history-list { display: flex; flex-direction: column; gap: 8px; }
.history-entry { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; }
.history-entry-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 0.85rem; }
.history-date { color: var(--muted); font-family: var(--font-mono); font-size: 0.76rem; }
.history-comment { margin: 6px 0 0; font-size: 0.85rem; color: var(--ink); }
.carte-menu-panel { max-width: 480px; }
.carte-menu-panel .form-header h2 { font-size: 1.7rem; letter-spacing: -0.01em; }
.carte-menu-panel .form-header { position: relative; padding-bottom: 12px; margin-bottom: 2px; }
.carte-menu-panel .form-header::after {
  content: ""; position: absolute; left: 0; bottom: 0; width: 64px; height: 3px;
  background: linear-gradient(90deg, var(--honey), transparent);
  border-radius: 999px;
}
.carte-menu-list { display: flex; flex-direction: column; gap: 2px; }
.carte-menu-item { display: flex; flex-direction: column; padding: 10px 4px; border-bottom: 1px solid var(--border); cursor: pointer; }
.carte-menu-item:hover { background: var(--tilleul); border-radius: 8px; }
.carte-menu-title { font-family: var(--font-display); font-size: 1.05rem; color: var(--sage); }
.carte-menu-sub { font-size: 0.76rem; color: var(--muted); margin-top: 2px; }

.carte-picker-panel { max-width: 460px; }
.carte-tiles { display: flex; flex-direction: column; gap: 8px; }
.carte-tile {
  display: flex; align-items: center; gap: 10px; background: var(--bg-card); border: 1px solid var(--border);
  border-radius: 4px 12px 12px 12px; padding: 13px 14px; cursor: pointer; text-align: left; font-family: var(--font-body);
  box-shadow: var(--shadow-sm); transition: transform 0.12s ease, box-shadow 0.12s ease;
}
.carte-tile:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); }
.carte-tile-title { font-family: var(--font-display); font-size: 1.1rem; color: var(--sage); flex: 1; }
.carte-tile-count { font-size: 0.72rem; color: var(--muted); font-family: var(--font-mono); white-space: nowrap; }

.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--sage); color: #FBFAF4; padding: 10px 18px; border-radius: 999px; font-size: 0.85rem; box-shadow: 0 6px 20px rgba(0,0,0,0.18); z-index: 150; }
.version-tag { position: fixed; bottom: 6px; right: 10px; font-size: 0.65rem; color: var(--muted); font-family: var(--font-mono); opacity: 0.6; }

/* ===== \xC9crans larges : ces r\xE8gles doivent rester en dernier dans la feuille de
   style pour bien l'emporter sur les r\xE8gles de base (.recipe-grid, .detail-view)
   d\xE9clar\xE9es plus haut avec la m\xEAme sp\xE9cificit\xE9. ===== */
@media (min-width: 760px) {
  .app-root { max-width: 1800px; padding: 22px 40px 56px; }
  .recipe-grid { grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }

  .detail-view {
    display: grid;
    grid-template-columns: 1fr 1fr;
    column-gap: 32px;
    row-gap: 16px;
    align-items: start;
  }
  .detail-area--header, .detail-area--hero { grid-column: 1 / -1; }
  .detail-area--photo { grid-column: 1; grid-row: 3 / 5; }
  .detail-area--cooking { grid-column: 2; grid-row: 3; }
  .detail-area--ingredients { grid-column: 2; grid-row: 4; }
  .detail-area--prep, .detail-area--history, .detail-area--tags, .detail-area--footer { grid-column: 1 / -1; }
  .detail-photo-frame img { width: 100%; max-height: 420px; object-fit: cover; }
  .steps-text, .step-item { font-size: 1.2rem; line-height: 1.85; max-width: 78ch; }
  .ing-table--readonly td, .ing-table--readonly th { font-size: 1rem; padding: 8px 9px; }
  .ingredient-list { font-size: 1.05rem; }
}
