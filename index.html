:root {
  --font-display: Georgia, "Iowan Old Style", "Palatino Linotype", "Book Antiqua", serif;
  --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
  --bg: #F5F3E9;
  --bg-card: #FFFFFF;
  --sage: #3F4F3A;
  --leaf: #7C9473;
  --tilleul: #E1E7D6;
  --honey: #C8862E;
  --ink: #34402F;
  --muted: #8C8870;
  --border: #E4E0D0;
}

* { box-sizing: border-box; }

.app-root { font-family: var(--font-body); background: var(--bg); color: var(--ink); min-height: 100vh; padding: 16px 16px 48px; max-width: 640px; margin: 0 auto; }

h1, h2, h3 { font-family: var(--font-display); color: var(--sage); margin: 0; }

.app-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 4px 2px 14px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 8px; }
.brand h1 { font-size: 1.4rem; font-weight: 600; }
.header-actions { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

.icon-btn { background: transparent; border: none; cursor: pointer; color: var(--sage); padding: 7px; border-radius: 10px; display: flex; align-items: center; justify-content: center; }
.icon-btn:hover { background: var(--tilleul); }
.icon-btn--danger { color: #A8512F; }
.icon-btn--danger:hover { background: #F3DED4; }

.btn { border: none; border-radius: 999px; cursor: pointer; font-family: var(--font-body); font-weight: 500; padding: 10px 16px; display: inline-flex; align-items: center; gap: 6px; font-size: 0.92rem; }
.btn-primary { background: var(--leaf); color: #FBFAF4; }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-ghost { background: transparent; color: var(--sage); border: 1px solid var(--border); }
.btn-sm { padding: 8px 13px; font-size: 0.85rem; }

.demo-banner { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: #FBF0DC; border: 1px solid #E8CB93; color: #7A5A22; border-radius: 12px; padding: 9px 12px; font-size: 0.82rem; margin-bottom: 10px; flex-wrap: wrap; }
.demo-banner .btn-ghost { border-color: #E8CB93; color: #7A5A22; white-space: nowrap; }

.search-bar { display: flex; align-items: center; gap: 8px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; padding: 9px 12px; color: var(--muted); margin-bottom: 10px; }
.search-bar input { border: none; outline: none; background: transparent; flex: 1; font-size: 0.95rem; color: var(--ink); font-family: var(--font-body); }

.filter-panel { background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; padding: 12px; margin-bottom: 14px; display: flex; flex-direction: column; gap: 8px; }
.filter-group-label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); margin-top: 4px; }
.filter-hint { text-transform: none; letter-spacing: normal; font-size: 0.7rem; opacity: 0.85; }
.chip-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip { border: 1px solid; border-radius: 999px; padding: 5px 11px; font-size: 0.8rem; cursor: pointer; font-family: var(--font-body); background: transparent; }
.sort-row { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: var(--muted); margin-top: 4px; }
.sort-row select { border: 1px solid var(--border); border-radius: 8px; padding: 4px 8px; font-family: var(--font-body); }

.strategy-picker { display: flex; gap: 4px; background: var(--tilleul); border-radius: 999px; padding: 3px; width: fit-content; }
.strategy-picker--compact { transform: scale(0.9); transform-origin: left; }
.strategy-btn { border: none; background: transparent; padding: 6px 12px; border-radius: 999px; font-size: 0.78rem; cursor: pointer; color: var(--sage); font-family: var(--font-body); }
.strategy-btn--active { background: var(--leaf); color: #FBFAF4; }

.recipe-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 420px) { .recipe-grid { grid-template-columns: 1fr; } }

.empty-state { grid-column: 1 / -1; text-align: center; padding: 40px 10px; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 10px; }
.empty-hint { color: var(--muted); font-size: 0.85rem; }

.card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 12px; cursor: pointer; display: flex; flex-direction: column; gap: 8px; transition: transform 0.12s ease, box-shadow 0.12s ease; }
.card:hover { box-shadow: 0 4px 14px rgba(63,79,58,0.10); transform: translateY(-1px); }
.card-top { display: flex; align-items: center; justify-content: space-between; }
.cat-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 0.72rem; padding: 3px 8px; border-radius: 999px; font-weight: 500; }
.card-title { font-size: 1.02rem; line-height: 1.25; }
.card-meta { display: flex; flex-wrap: wrap; gap: 8px; font-size: 0.76rem; color: var(--muted); font-family: var(--font-mono); }
.meta-item { display: flex; align-items: center; gap: 3px; }
.meta-price { color: var(--honey); font-weight: 500; }
.card-bottom { display: flex; align-items: center; justify-content: space-between; margin-top: 2px; }

.tested-pill { border: 1px solid var(--border); background: transparent; color: var(--muted); border-radius: 999px; padding: 4px 9px; font-size: 0.74rem; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; font-family: var(--font-body); }
.tested-pill--on { background: var(--tilleul); color: var(--sage); border-color: var(--leaf); }

.form-view, .detail-view { display: flex; flex-direction: column; gap: 14px; padding-top: 6px; }
.form-header { display: flex; align-items: center; gap: 10px; }
.form-header h2 { font-size: 1.15rem; }
.detail-actions { margin-left: auto; display: flex; gap: 4px; }

.field { display: flex; flex-direction: column; gap: 5px; font-size: 0.82rem; color: var(--muted); flex: 1; }
.field input, .field select, .field textarea { font-family: var(--font-body); font-size: 0.95rem; color: var(--ink); border: 1px solid var(--border); border-radius: 10px; padding: 9px 10px; background: var(--bg-card); outline: none; }
.field textarea { resize: vertical; font-family: var(--font-mono); font-size: 0.86rem; }
.field-row { display: flex; gap: 10px; }
.field-row--3 > .field { flex: 1; }
.select-with-add { display: flex; gap: 6px; align-items: center; }
.select-with-add select, .select-with-add input { flex: 1; }
.link-btn { background: none; border: none; color: var(--leaf); font-size: 0.78rem; cursor: pointer; white-space: nowrap; text-decoration: underline; display: inline-flex; align-items: center; gap: 4px; }

.toggles { align-items: center; flex-wrap: wrap; gap: 14px 18px; }
.switch-row { display: flex; align-items: center; gap: 6px; font-size: 0.88rem; color: var(--ink); }

.form-actions { display: flex; justify-content: flex-end; gap: 10px; padding-top: 6px; }

.detail-hero { display: flex; flex-direction: column; gap: 8px; }
.detail-hero h1 { font-size: 1.5rem; }
.detail-toggles { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 2px; }
.detail-section { border-top: 1px solid var(--border); padding-top: 12px; }
.detail-section h3 { font-size: 0.95rem; margin-bottom: 8px; }
.ingredient-list { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 5px; font-size: 0.92rem; }
.steps-text { white-space: pre-wrap; line-height: 1.55; font-size: 0.93rem; }
.notes-text { white-space: pre-wrap; font-size: 0.88rem; color: var(--muted); }
.tag-row { display: flex; flex-wrap: wrap; gap: 6px; }
.tag-row--sm { margin-top: -2px; }
.tag { background: var(--tilleul); color: var(--sage); border-radius: 999px; padding: 4px 10px; font-size: 0.76rem; }
.tag--sm { padding: 2px 8px; font-size: 0.68rem; }
.detail-footer { color: var(--muted); font-size: 0.88rem; }

.ing-table-wrap { display: flex; flex-direction: column; gap: 8px; }
.ing-table-header-row { display: flex; align-items: center; justify-content: space-between; font-size: 0.82rem; color: var(--muted); }
.ing-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
.ing-table th { text-align: left; font-size: 0.7rem; text-transform: uppercase; color: var(--muted); font-weight: 500; padding: 4px 6px; border-bottom: 1px solid var(--border); }
.ing-table td { padding: 4px 6px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.ing-table select, .ing-table input { width: 100%; font-size: 0.85rem; padding: 6px 7px; border: 1px solid var(--border); border-radius: 8px; font-family: var(--font-body); background: var(--bg-card); }
.ing-free-name { margin-top: 4px; }
.ing-free-row { display: flex; flex-direction: column; gap: 4px; }
.ing-quick-add { align-self: flex-start; font-size: 0.72rem; }
.ing-cost { font-family: var(--font-mono); color: var(--sage); white-space: nowrap; }
.ing-table--readonly td { font-family: var(--font-body); }

.cat-badge-row { display: flex; flex-wrap: wrap; gap: 4px; }
.card-thumb { border-radius: 10px; overflow: hidden; aspect-ratio: 16/10; background: var(--tilleul); }
.card-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.detail-photo { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.detail-photo img { width: 100%; max-height: 240px; object-fit: cover; border-radius: 14px; }
.detail-photo--linkonly { padding: 4px 0; }
.photo-field { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.photo-field input[type="text"], .photo-field > input { width: 100%; }
.photo-preview { display: flex; align-items: center; gap: 10px; }
.photo-preview img { width: 80px; height: 60px; object-fit: cover; border-radius: 8px; }
.photo-upload-btn { cursor: pointer; }
.photo-hint { font-size: 0.72rem; color: var(--muted); }
.cost-summary { background: var(--tilleul); border-radius: 12px; padding: 10px 14px; font-size: 0.9rem; color: var(--sage); }

.cost-range { color: var(--muted); font-size: 0.8rem; }

.overlay { position: fixed; inset: 0; background: rgba(52,64,47,0.35); display: flex; align-items: flex-start; justify-content: center; z-index: 100; padding: 20px 12px; overflow-y: auto; }
.overlay-panel { background: var(--bg); border-radius: 18px; padding: 18px; max-width: 640px; width: 100%; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 12px 40px rgba(0,0,0,0.25); }
.merc-intro { font-size: 0.85rem; color: var(--muted); margin: 0; }
.merc-new { display: flex; gap: 8px; flex-wrap: wrap; background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 10px; }
.merc-new input { flex: 2; min-width: 140px; padding: 7px 9px; border: 1px solid var(--border); border-radius: 8px; font-family: var(--font-body); }
.merc-new select { flex: 1; padding: 7px 9px; border: 1px solid var(--border); border-radius: 8px; font-family: var(--font-body); }
.merc-list { display: flex; flex-direction: column; gap: 8px; }
.merc-item { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; }
.merc-item-head { display: flex; align-items: center; justify-content: space-between; cursor: pointer; gap: 8px; }
.merc-item-right { display: flex; align-items: center; gap: 8px; }
.merc-unit-tag { color: var(--muted); font-size: 0.78rem; }
.merc-stats { font-size: 0.78rem; color: var(--muted); font-family: var(--font-mono); }
.merc-stats--empty { font-style: italic; }
.merc-item-body { margin-top: 10px; display: flex; flex-direction: column; gap: 10px; }
.merc-table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
.merc-table th { text-align: left; font-size: 0.68rem; text-transform: uppercase; color: var(--muted); padding: 4px 6px; border-bottom: 1px solid var(--border); }
.merc-table td { padding: 4px 6px; border-bottom: 1px solid var(--border); }
.merc-add-row { display: flex; gap: 6px; flex-wrap: wrap; }
.merc-add-row input { flex: 1; min-width: 110px; padding: 6px 8px; border: 1px solid var(--border); border-radius: 8px; font-family: var(--font-body); font-size: 0.82rem; }
.cat-manage-row { display: flex; align-items: center; gap: 8px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 6px 8px; }
.cat-manage-row input { flex: 1; border: none; background: transparent; font-family: var(--font-body); font-size: 0.92rem; padding: 4px 6px; outline: none; }

.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--sage); color: #FBFAF4; padding: 10px 18px; border-radius: 999px; font-size: 0.85rem; box-shadow: 0 6px 20px rgba(0,0,0,0.18); z-index: 150; }
.version-tag { position: fixed; bottom: 6px; right: 10px; font-size: 0.65rem; color: var(--muted); font-family: var(--font-mono); opacity: 0.6; }
