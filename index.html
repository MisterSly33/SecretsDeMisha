:root {
  --font-display: Georgia, "Iowan Old Style", "Palatino Linotype", "Book Antiqua", serif;
  --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
  --bg: #F5F3E9;
  --bg-card: #FFFDF8;
  --sage: #3F4F3A;
  --sage-deep: #2C3928;
  --leaf: #7C9473;
  --tilleul: #E1E7D6;
  --honey: #C8862E;
  --honey-deep: #9C671F;
  --ink: #34402F;
  --muted: #8C8870;
  --border: #E1DCC7;
  --shadow-sm: 0 1px 3px rgba(63,79,58,0.10);
  --shadow-md: 0 6px 18px rgba(63,79,58,0.14);
  --shadow-lg: 0 14px 36px rgba(44,57,40,0.20);
}

* { box-sizing: border-box; }

.app-root {
  font-family: var(--font-body); color: var(--ink); min-height: 100vh; padding: 18px 16px 48px; max-width: 640px; margin: 0 auto;
  background-color: var(--bg);
  background-image:
    radial-gradient(ellipse 120% 80% at 15% -10%, rgba(124,148,115,0.13), transparent 55%),
    radial-gradient(ellipse 90% 60% at 100% 0%, rgba(200,134,46,0.09), transparent 50%);
  background-attachment: fixed;
}
/* Sur \xE9cran large (tablette pos\xE9e en cuisine, ordinateur), l'appli utilise toute la largeur disponible */
h1, h2, h3 { font-family: var(--font-display); color: var(--sage); margin: 0; }

.app-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; padding: 6px 2px 16px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 9px; }
.brand h1 { font-size: 1.62rem; font-weight: 600; letter-spacing: -0.01em; line-height: 1.1; }
.brand-block { display: flex; flex-direction: column; gap: 3px; }
.brand-tagline { font-family: var(--font-display); font-style: italic; font-size: 0.78rem; color: var(--honey-deep); letter-spacing: 0.01em; }
.version-pill { font-family: var(--font-mono); font-size: 0.66rem; color: var(--muted); background: var(--tilleul); padding: 2px 7px; border-radius: 999px; align-self: flex-start; }
.header-actions { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }

.icon-btn { background: transparent; border: none; cursor: pointer; color: var(--sage); padding: 7px; border-radius: 10px; display: flex; align-items: center; justify-content: center; transition: background 0.15s ease, transform 0.1s ease; }
.icon-btn:hover { background: var(--tilleul); }
.icon-btn:active { transform: scale(0.94); }
.icon-btn--active { background: #FBF0DC; }
.icon-btn--danger { color: #A8512F; }
.icon-btn--danger:hover { background: #F3DED4; }

.btn { border: none; border-radius: 999px; cursor: pointer; font-family: var(--font-body); font-weight: 500; padding: 10px 16px; display: inline-flex; align-items: center; gap: 6px; font-size: 0.92rem; transition: transform 0.12s ease, box-shadow 0.12s ease; }
.btn-primary { background: linear-gradient(180deg, #86A17B, var(--leaf)); color: #FBFAF4; box-shadow: var(--shadow-sm); }
.btn-primary:hover:not(:disabled) { transform: translateY(-1px); box-shadow: var(--shadow-md); }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-ghost { background: var(--bg-card); color: var(--sage); border: 1px solid var(--border); }
.btn-ghost:hover { border-color: var(--leaf); }
.btn-sm { padding: 8px 13px; font-size: 0.85rem; }

.demo-banner { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: #FBF0DC; border: 1px solid #E8CB93; color: #7A5A22; border-radius: 12px; padding: 9px 12px; font-size: 0.82rem; margin-bottom: 10px; flex-wrap: wrap; }
.demo-banner .btn-ghost { border-color: #E8CB93; color: #7A5A22; white-space: nowrap; }

.search-bar { display: flex; align-items: center; gap: 8px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; padding: 9px 12px; color: var(--muted); margin-bottom: 10px; box-shadow: var(--shadow-sm); }
.search-bar input { border: none; outline: none; background: transparent; flex: 1; font-size: 0.95rem; color: var(--ink); font-family: var(--font-body); }
.search-scope-btn { border: 1px solid var(--border); background: transparent; color: var(--muted); border-radius: 999px; padding: 4px 10px; font-size: 0.7rem; cursor: pointer; white-space: nowrap; font-family: var(--font-body); }
.search-scope-btn--on { background: var(--leaf); color: #FBFAF4; border-color: var(--leaf); }

.filter-panel { background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; padding: 12px; margin-bottom: 14px; display: flex; flex-direction: column; gap: 8px; box-shadow: var(--shadow-sm); }
.filter-group-label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); margin-top: 4px; }
.filter-hint { text-transform: none; letter-spacing: normal; font-size: 0.7rem; opacity: 0.85; }
.chip-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
